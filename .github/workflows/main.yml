name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22.x'

      - name: Install dependencies for CI
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # itch mode (.env.itch): coop and leaderboard go to our server, the game runs in the itch.io iframe
      - name: Run build
        run: npx vite build --config vite/config.prod.mjs --mode itch

      - name: Upload build artifact
        uses: actions/upload-artifact@v4.6.1
        with:
          name: game-build
          path: dist/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4.1.9
        with:
          name: game-build
          path: dist/

      # Repository settings: secret BUTLER_CREDENTIALS (itch.io API key), variables ITCH_USER and ITCH_GAME
      # (https://ITCH_USER.itch.io/ITCH_GAME)
      - name: Upload to itch.io
        uses: rthery/butler-publish-itchio-action@v1.1.1
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: html5
          ITCH_GAME: ${{ vars.ITCH_GAME }}
          ITCH_USER: ${{ vars.ITCH_USER }}
          PACKAGE: dist/
